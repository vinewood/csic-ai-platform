{% extends "base.html" %}
{% set active_nav = 'research' %}
{% block title %}科研工作台 — 中船党校 AI助手{% endblock %}
{% block vue_app %}
{% raw %}
<script>
const { createApp, ref, computed, onMounted } = Vue;
const app = createApp({
  setup() {
    const projects = ref([]); const loading = ref(true);
    onMounted(() => { if(window.MOCK) MOCK.list('projects').then(r => { projects.value=r.data; loading.value=false; }); });
    return { projects, loading };
  },
  template:`
    <div style="padding:24px;max-width:1280px;margin:0 auto;">
      <el-card shadow="never" style="margin-bottom:24px;background:linear-gradient(135deg,#409eff,#79bbff);color:#fff;border:none;">
        <h2 style="margin:0 0 4px;color:#fff;">科研工作台</h2>
        <p style="color:rgba(255,255,255,0.8);font-size:13px;margin:0;">选题分析 · 文献检索 · 论文润色</p>
      </el-card>
      <el-row :gutter="16">
        <el-col :span="8" v-for="p in projects" :key="p.id" style="margin-bottom:16px;">
          <el-card shadow="hover">
            <h3 style="margin:0 0 8px;">{{ p.name }}</h3>
            <p style="color:#909399;font-size:13px;margin:0;">{{ p.desc }}</p>
            <div style="margin-top:12px;font-size:12px;color:#909399;">{{ p.members||0 }} 人 · {{ p.papers||0 }} 篇论文</div>
          </el-card>
        </el-col>
      </el-row>
      <el-card v-if="loading" shadow="never" style="text-align:center;padding:40px;"><i class="el-icon-loading" style="font-size:24px;"></i><p>加载中...</p></el-card>
    </div>
  `
});
app.use(ElementPlus); app.mount('#app-mount');
document.getElementById('loading-splash')?.style.setProperty('display','none');
</script>
{% endraw %}
{% endblock %}
