{% extends "base.html" %}
{% set show_topbar = false %}
{% block title %}登录 — 中船党校 AI助手{% endblock %}
{% block vue_app %}
{% raw %}
<script>
const { createApp, ref, reactive } = Vue;
const app = createApp({
  setup() {
    const form = reactive({role:'teacher',username:'',password:''});
    const loading = ref(false);
    const roleMap = {teacher:'/workspace/teaching',researcher:'/workspace/research',rss:'/workspace/news',admin:'/workspace/admin'};
    const handleLogin = () => {loading.value=true;setTimeout(()=>{window.location.href=roleMap[form.role]||'/chat';},500);};
    return {form,loading,handleLogin};
  },
  template:`
    <div style="min-height:100vh;background:linear-gradient(160deg,#0A1628 0%,#0F2347 40%,#0A1628 100%);display:flex;align-items:center;justify-content:center;position:relative;">
      <div style="position:absolute;inset:0;background:url(/static/img/ship-bg.jpg) center/cover no-repeat;opacity:0.12;"></div>
      <el-card style="width:400px;border-radius:20px;position:relative;z-index:1;">
        <div style="text-align:center;margin-bottom:20px;">
          <el-image src="/static/img/logo.png" style="width:120px;margin-bottom:12px;" />
          <h3 style="margin:0;font-weight:700;font-size:18px;">AI助手</h3>
          <p style="color:#999;font-size:13px;margin:4px 0 0;">中国船舶集团党校</p>
        </div>
        <el-form :model="form" label-position="top" @submit.prevent="handleLogin">
          <el-form-item label="选择身份">
            <el-select v-model="form.role" style="width:100%;">
              <el-option label="讲师" value="teacher" /><el-option label="研究员" value="researcher" />
              <el-option label="RSS订阅" value="rss" /><el-option label="管理员" value="admin" />
            </el-select>
          </el-form-item>
          <el-form-item label="账号"><el-input v-model="form.username" placeholder="请输入账号" /></el-form-item>
          <el-form-item label="密码"><el-input v-model="form.password" type="password" show-password placeholder="请输入密码" /></el-form-item>
          <el-form-item><el-button type="primary" native-type="submit" :loading="loading" style="width:100%;height:44px;">登 录</el-button></el-form-item>
        </el-form>
        <p style="text-align:center;color:#999;font-size:11px;margin:0;">演示环境：选择身份后直接登录</p>
      </el-card>
    </div>
  `
});
app.use(ElementPlus); app.mount('#app-mount');
document.getElementById('loading-splash')?.style.setProperty('display','none');
</script>
{% endraw %}
{% endblock %}
