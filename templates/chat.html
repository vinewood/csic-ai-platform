{% extends "base.html" %}
{% set active_nav = 'chat' %}
{% block title %}AI 对话 — 中船党校 AI助手{% endblock %}
{% block vue_app %}
{% raw %}
<script>
const { createApp, ref, reactive, computed, nextTick, onMounted, watch } = Vue;
const MODELS = [
  {id:'qwen-max',label:'通义千问 Max'},{id:'qwen-plus',label:'通义千问 Plus'},
  {id:'glm-4',label:'智谱 GLM-4'},{id:'moonshot-v1',label:'Kimi K2.7'},
  {id:'deepseek-chat',label:'DeepSeek V3'},{id:'doubao-pro',label:'豆包 Pro'}
];
const WELCOME_PROMPTS = [
  {key:'topic',label:'分析党建课题选题'},{key:'course',label:'设计干部培训课程大纲'},
  {key:'paper',label:'润色论文摘要'},{key:'news',label:'总结船舶行业新闻'}
];
const app = createApp({
  setup() {
    const messages = ref([]); const input = ref(''); const loading = ref(false);
    const senderContent = ref('');
    const selectedModel = ref('qwen-max'); const chatMode = ref('single');
    const multiModels = ref(['qwen-max','deepseek-chat']);
    const conversations = ref([]); const currentConvId = ref(null);
    const bubbleListRef = ref(null);

    const showWelcome = computed(() => messages.value.length === 0 && !loading.value);

    onMounted(() => {
      if(window.MOCK){
        MOCK.list('conversations').then(r=>{conversations.value=r.data;});
        try{
          var sk=new URLSearchParams(window.location.search).get('skill');
          if(sk){MOCK.list('skills').then(r=>{var f=r.data.find(s=>s.id===sk);if(f)input.value='请使用 '+f.name+' 技能';});}
        }catch(e){}
      }
    });

    watch(messages, () => { nextTick(() => { bubbleListRef.value?.scrollToBottom(); }); }, {deep:true});

    const sendMessage = (content) => {
      var text = (content || senderContent.value || '').trim();
      if(!text||loading.value) return;
      messages.value.push({role:'user',content:text,id:'m_'+Date.now(),placement:'end'});
      senderContent.value='';loading.value=true;
      if(chatMode.value==='single'){
        var aid='a_'+Date.now();
        var typingMsg = {role:'assistant',content:'',id:aid,model:selectedModel.value,placement:'start',typing:true,typingOver:false};
        messages.value.push(typingMsg);
        if(window.MOCK) MOCK.chatStream([{role:'user',content:text}],selectedModel.value,function(chunk){
          if(chunk===null){
            var idx=messages.value.findIndex(m=>m.id===aid);
            if(idx>=0){messages.value[idx].typingOver=true;messages.value[idx].typing=false;}
            loading.value=false;
          }else{
            var idx=messages.value.findIndex(m=>m.id===aid);
            if(idx>=0)messages.value[idx].content+=chunk;
          }
        });
      }else if(window.MOCK){
        var mmId='mm_'+Date.now();
        var ms=multiModels.value.map(function(m){return{model:m,content:'',streaming:true};});
        messages.value.push({role:'assistant',models:ms,id:mmId,placement:'start'});
        multiModels.value.forEach(function(mId){
          MOCK.chatStream([{role:'user',content:text}],mId,function(chunk){
            var msg=messages.value.find(m=>m.id===mmId);
            if(msg){
              var me=msg.models.find(m=>m.model===mId);
              if(me){
                if(chunk===null){me.streaming=false;loading.value=msg.models.some(m=>m.streaming);}
                else me.content+=chunk;
              }
            }
          });
        });
      }
    };

    const newConv = () => {
      var c={id:'c_'+Date.now(),title:'新对话',messages:0,updatedAt:new Date().toLocaleString()};
      conversations.value.unshift(c);currentConvId.value=c.id;messages.value=[];
    };

    const switchConv = (id) => {
      currentConvId.value=id;messages.value=[];
      if(window.MOCK) MOCK.list('messages',{filter:{convId:id}}).then(r=>{
        messages.value=r.data.map(function(m){return Object.assign({},m,{placement:m.role==='user'?'end':'start'});});
      });
    };

    const getModelLabel = (id) => {var m=MODELS.find(x=>x.id===id);return m?m.label:id;};
    const handlePrompt = (p) => {
      var pmt = {topic:'请帮我分析一个基层党建工作的研究课题选题方向',course:'请为我设计一堂关于"党的二十大精神解读"的干部培训课程大纲',
             paper:'请帮我润色以下论文摘要，使其更加学术规范',news:'请总结今天中国船舶行业的重点新闻动态'};
      sendMessage(pmt[p.key]||pmt.topic);
    };

    return {messages,input,loading,senderContent,selectedModel,chatMode,multiModels,conversations,currentConvId,
            MODELS,WELCOME_PROMPTS,sendMessage,newConv,switchConv,getModelLabel,handlePrompt,showWelcome,bubbleListRef};
  },
  template:`
    <div style="display:flex;height:calc(100vh - 56px);background:#f5f7fa;">
      {/* ── 对话侧栏 ── */}
      <div style="width:260px;background:#fff;border-right:1px solid #e4e7ed;display:flex;flex-direction:column;flex-shrink:0;">
        <div style="padding:12px;"><el-button type="primary" @click="newConv" style="width:100%;">+ 新建对话</el-button></div>
        <div style="flex:1;overflow-y:auto;padding:0 8px;">
          <div v-for="c in conversations" :key="c.id" @click="switchConv(c.id)"
            :style="{padding:'10px 12px',cursor:'pointer',borderRadius:8,background:currentConvId===c.id?'#ecf5ff':'transparent',marginBottom:2}">
            <div style="font-size:13px;font-weight:500;color:#303133;">{{ c.title }}</div>
            <div style="font-size:11px;color:#909399;">{{ String(c.updatedAt||'').slice(5,16) }}</div>
          </div>
          <div v-if="!conversations.length" style="text-align:center;padding:40px 16px;color:#c0c4cc;font-size:13px;">
            <div style="font-size:32px;margin-bottom:12px;">💬</div>暂无对话<br>点击上方开始新对话
          </div>
        </div>
      </div>

      {/* ── 主聊天区 ── */}
      <div style="flex:1;display:flex;flex-direction:column;min-width:0;">
        {/* ── 顶部工具栏 ── */}
        <div style="padding:8px 20px;background:#fff;border-bottom:1px solid #e4e7ed;display:flex;align-items:center;gap:12px;flex-wrap:wrap;flex-shrink:0;">
          <el-radio-group v-model="chatMode" size="small">
            <el-radio-button value="single">单模型</el-radio-button>
            <el-radio-button value="multi">多模型对比</el-radio-button>
          </el-radio-group>
          <el-select v-if="chatMode==='single'" v-model="selectedModel" size="small" style="width:180px;">
            <el-option v-for="m in MODELS" :key="m.id" :label="m.label" :value="m.id" />
          </el-select>
          <template v-else>
            <el-checkbox-group v-model="multiModels" size="small" style="display:flex;gap:8px;flex-wrap:wrap;">
              <el-checkbox v-for="m in MODELS" :key="m.id" :label="m.id" :disabled="multiModels.length>=6&&multiModels.indexOf(m.id)===-1">{{ m.label }}</el-checkbox>
            </el-checkbox-group>
            <span style="font-size:11px;color:#909399;">{{ multiModels.length }}/6</span>
          </template>
        </div>

        {/* ── 消息列表（Element AI Vue BubbleList）── */}
        <div style="flex:1;overflow:hidden;">
          <el-ai-bubble-list ref="bubbleListRef" v-if="!showWelcome" style="height:100%;padding:20px 16px;">
            <template v-for="(msg,i) in messages" :key="msg.id">
              {/* 多模型对比视图 */}
              <div v-if="msg.models" style="margin-bottom:16px;">
                <div style="display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap;">
                  <el-tag v-for="(m,j) in msg.models" :key="j" :type="j===0?'primary':'info'" size="small">
                    {{ getModelLabel(m.model) }}{{ m.streaming?' ●':'' }}
                  </el-tag>
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
                  <div v-for="(m,j) in msg.models" :key="j"
                    style="padding:12px 16px;border-radius:12px;background:#fff;border:1px solid #e4e7ed;line-height:1.6;font-size:14px;white-space:pre-wrap;">
                    {{ m.content||'思考中...' }}
                  </div>
                </div>
              </div>
              {/* 单模型/用户消息 */}
              <el-ai-bubble v-else
                :placement="msg.role==='user'?'end':'start'"
                :variant="msg.role==='user'?'filled':'outlined'"
                :shape="msg.role==='user'?'corner':'round'"
                :is-markdown="msg.role==='assistant'"
                :typing="msg.role==='assistant'&&i===messages.length-1&&loading"
                :loading="false"
                :content="msg.content"
              >
                <template #header v-if="msg.role==='assistant'&&msg.model">
                  <span style="font-size:11px;color:#909399;">{{ getModelLabel(msg.model) }}</span>
                </template>
              </el-ai-bubble>
            </template>
          </el-ai-bubble-list>

          {/* ── 欢迎页 ── */}
          <div v-if="showWelcome" style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:#909399;">
            <div style="font-size:64px;margin-bottom:20px;">🤖</div>
            <h3 style="color:#606266;margin:0 0 8px;">开始 AI 对话</h3>
            <p style="max-width:400px;text-align:center;margin-bottom:24px;color:#909399;">选择模型，输入问题，获得专业回答</p>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:500px;">
              <el-button v-for="p in WELCOME_PROMPTS" :key="p.key" @click="handlePrompt(p)" size="large" style="height:auto;padding:14px 16px;white-space:normal;text-align:left;">{{ p.label }}</el-button>
            </div>
          </div>
        </div>

        {/* ── 输入区域（Element AI Vue Sender）── */}
        <div style="padding:12px 20px;background:#fff;border-top:1px solid #e4e7ed;flex-shrink:0;">
          <div style="max-width:800px;margin:0 auto;">
            <el-ai-sender
              v-model="senderContent"
              :loading="loading"
              placeholder="输入问题... (Enter 发送)"
              @send="sendMessage"
            />
          </div>
        </div>
      </div>
    </div>
  `
});
app.use(ElementPlus);
app.use(ElementAiVue);
app.mount('#app-mount');
document.getElementById('loading-splash')?.style.setProperty('display','none');
</script>
{% endraw %}
{% endblock %}
